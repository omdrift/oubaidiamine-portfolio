<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Comparaison des approches explorées"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6ce0d1"/></marker></defs><rect width="100%" height="100%" fill="#0b1525"/><text x="50" y="63" fill="#f1f6ff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start">Comparaison des approches explorées</text><text x="50" y="102" fill="#a9bbd7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Synthèse de la présentation de groupe ; résultats qualitatifs à interpréter avec prudence</text><rect x="52" y="164" width="414" height="380" rx="18" fill="#14253b" stroke="#405575"/><text x="77" y="223" fill="#f5f8ff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">RAFT + warping</text><text x="77" y="263" fill="#79dbc9" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" text-anchor="start">Transport du flot optique</text><text x="77" y="317" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Estime le champ de déplacement (u, v).</text><text x="77" y="368" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Warpe les frames précédentes.</text><text x="77" y="419" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Ne crée pas de nouvelle fumée.</text><text x="77" y="470" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Limite : zones peu texturées.</text><rect x="490" y="164" width="414" height="380" rx="18" fill="#14253b" stroke="#405575"/><text x="515" y="223" fill="#f5f8ff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">ConvLSTM</text><text x="515" y="263" fill="#79dbc9" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" text-anchor="start">Prédiction spatio-temporelle</text><text x="515" y="317" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Convolutions dans les états LSTM.</text><text x="515" y="368" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Apprend forme et évolution locale.</text><text x="515" y="419" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Sorties autoregressives successives.</text><text x="515" y="470" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Limite : drift, diversité des données.</text><rect x="928" y="164" width="414" height="380" rx="18" fill="#143c40" stroke="#3b9690"/><text x="953" y="223" fill="#f5f8ff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">VQGAN + Flow Matching</text><text x="953" y="263" fill="#79dbc9" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" text-anchor="start">Génération en espace latent</text><text x="953" y="317" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Encode le panache en représentation latente.</text><text x="953" y="368" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Apprend un champ de vitesses conditionnel.</text><text x="953" y="419" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Intégration ODE puis décodage.</text><text x="953" y="470" fill="#d2dfef" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">• Limite : fidélité et horizons longs.</text><text x="52" y="587" fill="#a9bbd7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">Conclusion du diaporama : Flow Matching est jugé le plus prometteur, sans benchmark exhaustif publié.</text></svg>