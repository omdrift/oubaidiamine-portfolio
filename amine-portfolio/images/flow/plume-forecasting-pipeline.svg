<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" role="img" aria-labelledby="title desc">
  <title id="title">Industrial Plume Forecasting pipeline</title>
  <desc id="desc">Native RISE video is processed per frame by CLIPSeg and saved as masked RGB. The model uses five observed frames to forecast fifteen.</desc>
  <defs>
    <pattern id="observed" width="42" height="44" patternUnits="userSpaceOnUse"><rect width="38" height="44" rx="3" fill="#a8c4b0"/></pattern>
    <pattern id="future" x="216" width="42" height="44" patternUnits="userSpaceOnUse"><rect width="38" height="44" rx="3" fill="#f5ac8a"/></pattern>
  </defs>
  <rect width="960" height="454" rx="18" fill="#1d2b25"/>
  <g fill="#fff9f0" font-family="system-ui, sans-serif">
    <text x="56" y="64" fill="#f5ac8a" font-size="20" letter-spacing="2">DATA → REPRESENTATION → FORECAST</text>
    <g font-size="27" font-weight="600">
      <text x="56" y="128">RISE</text>
      <text x="280" y="128">CLIPSeg</text>
      <text x="504" y="128">VQGAN</text>
      <text x="710" y="128">Flow Matching</text>
    </g>
    <g font-size="20" fill="#c4cdc3">
      <text x="56" y="165">36 × 180 × 180</text>
      <text x="280" y="165">64 × 64 RGB</text>
      <text x="504" y="165">8 × 8 × D</text>
      <text x="710" y="165">Conditional field</text>
    </g>
    <g font-size="25" fill="#f5ac8a"><text x="229" y="130">→</text><text x="453" y="130">→</text><text x="662" y="130">→</text></g>
    <path d="M56 208H904" stroke="#4d5e54"/>
    <text x="56" y="261" font-size="20" letter-spacing="2" fill="#c4cdc3">EVALUATION WINDOW</text>
    <g transform="translate(56 290)">
      <rect width="210" height="44" fill="url(#observed)"/>
      <rect x="216" width="630" height="44" fill="url(#future)"/>
    </g>
    <text x="56" y="379" font-size="23">5 observed</text>
    <text x="272" y="379" font-size="23">15 to forecast</text>
  </g>
</svg>
